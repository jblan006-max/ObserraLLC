version: "3.9"

# Obserra SAP UAC — self-hosted, on-premise deployment.
# One command brings up MongoDB, the FastAPI backend and the React frontend behind nginx.
#   ./install.sh          (recommended)
# or, from the package root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Then open http://<this-machine-ip>:8080

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - obserra_uac_mongo:/data/db
    networks: [obserra]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on: [mongodb]
    networks: [obserra]

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # Browser talks to the backend through the same host on port 8080 (nginx proxies /api).
        REACT_APP_BACKEND_URL: ${PUBLIC_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [backend]
    networks: [obserra]

volumes:
  obserra_uac_mongo:

networks:
  obserra:
    driver: bridge
