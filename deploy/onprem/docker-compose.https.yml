version: "3.9"

# Obserra EU CRA Governance — self-hosted with automatic HTTPS via Caddy (Let's Encrypt).
#
# Prerequisites:
#   • A public DNS A/AAAA record for $DOMAIN pointing at this host.
#   • Ports 80 AND 443 open to the internet (Let's Encrypt validation).
#   • In deploy/.env set:  DOMAIN=your.domain  ACME_EMAIL=you@company  PUBLIC_URL=https://your.domain
#
# Launch (from the package root that contains backend/ frontend/ deploy/):
#   docker compose -f deploy/docker-compose.https.yml --env-file deploy/.env up -d --build
#
# Then open:  https://<DOMAIN>

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - obserra_uac_mongo:/data/db
    networks: [obserra]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on: [mongodb]
    networks: [obserra]

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # Browser reaches the backend at https://<DOMAIN>/api (Caddy -> frontend nginx -> backend).
        REACT_APP_BACKEND_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on: [backend]
    networks: [obserra]
    # No host port published — Caddy terminates TLS and proxies to this container internally.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks: [obserra]

volumes:
  obserra_uac_mongo:
  caddy_data:
  caddy_config:

networks:
  obserra:
    driver: bridge
