crons:
  - name: monthly-board-report
    description: "Generates and emails the executive board report to each org's admins/execs on the 1st"
    cron: "0 8 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-board-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-drift-digest
    description: "Emails 'weekly' cadence owners/admins open control-drift alerts AND posts a weekly risk summary to each org's Teams channel, Monday 08:00 UTC"
    cron: "0 8 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-drift-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-drift-digest
    description: "Emails 'daily' cadence owners/admins a digest of open control-drift alerts every day 08:00 UTC"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-drift-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-studio-report
    description: "Composes and emails each org's scheduled Studio report to admins/execs on the 1st at 09:00 UTC"
    cron: "0 9 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-studio-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-studio-report
    description: "Emails each org's 'weekly' cadence Studio report to admins/execs every Monday 09:00 UTC"
    cron: "0 9 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-studio-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-spend-report
    description: "Emails admins/execs the full per-teammate AI advisor spend report on the 1st at 09:30 UTC"
    cron: "30 9 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-spend-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: connector-health
    description: "Daily re-verify of each org's LIVE Microsoft 365 connection; flips to degraded + alerts admins if creds expire (07:30 UTC)"
    cron: "30 7 * * *"
    endpoint: "{{BASE_URL}}/api/cron/connector-health"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
