crons:
  - name: monthly-board-report
    description: "Generates and emails the executive board report to each org's admins/execs on the 1st"
    cron: "0 8 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-board-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-guide-refresh
    description: "Refreshes dashboard screenshots and rebuilds the install/user guides every Sunday 06:00 UTC"
    cron: "0 6 * * 0"
    endpoint: "{{BASE_URL}}/api/cron/weekly-guide-refresh"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-drift-digest
    description: "Weekly control-drift email + Teams risk summary + exec remediation-momentum + SAP Slack/Teams Ask recap, Monday 08:00 UTC"
    cron: "0 8 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-drift-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-drift-digest
    description: "Daily 08:00 UTC: drift digest, autonomous remediation, threat-intel sync, connector health re-probe + Slack/Teams alert on expiry, and zero-touch device/user asset mapping"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-drift-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: hourly-overdue-digest
    description: "Hourly: sends the overdue auditor-request digest + SLA escalation; each org self-gates to its configured UTC hour and days. (Monthly Studio report is folded into monthly-board-report.)"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/hourly-overdue-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
