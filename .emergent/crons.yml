crons:
  - name: monthly-board-report
    description: "Generates and emails the executive board report to each org's admins/execs on the 1st"
    cron: "0 8 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-board-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-drift-digest
    description: "Emails 'weekly' cadence owners/admins a digest of open control-drift alerts every Monday 08:00 UTC"
    cron: "0 8 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-drift-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-drift-digest
    description: "Emails 'daily' cadence owners/admins a digest of open control-drift alerts every day 08:00 UTC"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-drift-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-studio-report
    description: "Composes and emails each org's scheduled Studio report to admins/execs on the 1st at 09:00 UTC"
    cron: "0 9 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-studio-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
